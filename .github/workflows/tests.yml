name: Tests
run-name: "Test ${{ github.head_ref }} (PR #${{ github.event.pull_request.number }})"

# Every pull request: the unit tests (no Databricks connection needed). Deploying is ci.yml, on demand.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk pyyaml pytest
      - run: pytest -q tests
