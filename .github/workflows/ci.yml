name: CI and deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the bundle to the governance workspace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk pyyaml pytest
      - run: pytest -q tests

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: governance
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Sign in only as the service principal with its Databricks OAuth secret. Without this, the CLI tries every
      # method and a failure only says "cannot configure default credentials"; with it, the real cause is shown.
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      # Shows the host and the identity the run signs in as (secrets stay masked).
      - run: databricks auth describe
      - run: databricks current-user me
      - run: databricks bundle validate -t governance
      - run: databricks bundle deploy -t governance
