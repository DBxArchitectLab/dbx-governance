name: CI and deploy
# The run's title in the Actions list: what ran, from which branch, and who started it.
run-name: "${{ format('{0} {1} → governance (@{2})', inputs.deploy && 'Deploy' || 'Validate', github.ref_name, github.actor) }}"

# Run workflow: the selected branch ("Use workflow from") validated and, with "Deploy" ticked (the default), deployed to
# the governance workspace. The unit tests are tests.yml, on every pull request.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the bundle to the governance workspace (untick to validate only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to governance workspace
    runs-on: ubuntu-latest
    environment: governance
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Sign in only as the service principal with its Databricks OAuth secret. Without this, the CLI tries every
      # method and a failure only says "cannot configure default credentials"; with it, the real cause is shown.
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      # Shows the host and the identity the run signs in as (secrets stay masked).
      - run: databricks auth describe
      - run: databricks current-user me
      - run: databricks bundle validate -t governance
      - if: inputs.deploy
        run: databricks bundle deploy -t governance
