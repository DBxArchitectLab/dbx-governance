resources:
  jobs:
    # Run on demand: plan first, then apply, one environment at a time (dev, then uat, then prod).
    identity_group_migration:
      name: identity-workspace-group-migration
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: plan
        - name: environments
          default: dev
        - name: delete_local_groups
          default: "false"
      tasks:
        - task_key: migrate
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/migrate_workspace_groups.py
            parameters:
              - --config
              - ${workspace.file_path}/config/group_migration.yaml
              - --mode
              - "{{job.parameters.mode}}"
              - --environments
              - "{{job.parameters.environments}}"
              - --delete-local-groups
              - "{{job.parameters.delete_local_groups}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.40.0
              - pyyaml
