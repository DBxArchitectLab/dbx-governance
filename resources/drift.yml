resources:
  # Where the drift results live in the governance catalog. The names must match config/drift.yml (output).
  schemas:
    drift:
      catalog_name: dbxarchitectlab_governance
      name: drift
      comment: Terraform drift detection and audit for the workspaces of dbx-platform-infra-azure (findings, health).

  volumes:
    # The drift workflow uploads each run's plan findings here, one folder per GitHub run ID.
    plan_findings:
      catalog_name: dbxarchitectlab_governance
      schema_name: ${resources.schemas.drift.name}
      name: plan_findings
      volume_type: MANAGED

  jobs:
    # The audit side of drift detection. No schedule: the drift workflow (.github/workflows/drift.yml) starts it after
    # the plans, with its run ID. Run it by hand with run_id = an earlier run's ID to re-read those plans.
    drift_audit:
      name: terraform-drift-audit
      max_concurrent_runs: 1
      parameters:
        - name: run_id
          default: manual
      tasks:
        # A notebook on serverless compute: each step is a cell, and the run page shows health and the findings.
        # The job parameter run_id reaches the notebook's run_id widget.
        - task_key: audit
          notebook_task:
            notebook_path: ../src/notebooks/terraform_drift_audit.py
            base_parameters:
              config: ${workspace.file_path}/config/drift.yml
