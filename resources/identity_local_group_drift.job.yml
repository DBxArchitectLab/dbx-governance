resources:
  jobs:
    # Daily drift check: fails when any workspace-local group exists in dev, uat or prod.
    identity_local_group_drift:
      name: identity-local-group-drift-check
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - "dbxarchitectlab@gmail.com"
      tasks:
        - task_key: detect
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/migrate_workspace_groups.py
            parameters:
              - --config
              - ${workspace.file_path}/config/group_migration.yaml
              - --mode
              - plan
              - --environments
              - dev,uat,prod
              - --fail-on-local-groups
              - "true"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.40.0
              - pyyaml
