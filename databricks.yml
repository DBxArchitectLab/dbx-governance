bundle:
  name: dbx-governance

include:
  - resources/*.yml

targets:
  # The dedicated governance workspace. The jobs reach dev, uat and prod through the account and workspace APIs.
  governance:
    mode: production
    default: true
    workspace:
      host: "https://adb-7405610301840934.14.azuredatabricks.net"
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: "<governance-sp-application-id>"
